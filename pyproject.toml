[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-pentest"
version = "0.1.0"
description = "Authorized Security Assessment Framework — auditable, scope-gated external assessments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aegis" }]
keywords = ["security", "pentest", "authorized", "assessment", "recon", "owasp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "dnspython>=2.4",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["../catalog/*.yaml", "../catalog/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
